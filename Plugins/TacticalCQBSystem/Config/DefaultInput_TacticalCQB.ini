; Merge or reference these Enhanced Input bindings in your project.
; Running Content/Python/SetupTacticalCQBAssets.py in UE5 Editor creates IMC_TacticalCQB automatically!
;
; Default Controls matching the reference video:
;   WASD          - Move
;   Mouse         - Look
;   LMB           - Fire
;   RMB           - Aim Down Sights (ADS / Holographic Optic)
;   R             - Tactical Reload
;   B             - Attach / Detach Suppressor (1911)
;   Space         - Jump / Parkour Vault over waist-high cover
;   Left Shift    - Sprint
;   C / Ctrl      - Crouch / Combat Slide (while sprinting)
;   Left Alt      - Max Payne Supine Dive-to-Back (auto Bullet-Time)
;   Q / E (Hold)  - Lean Left / Lean Right (auto Wall-Brace IK near cover)
;   F             - Grab Human Shield / Execute Shield / Pick Up Weapon / Door Bash
;   E (Tap)       - Front Spartan Kick (kick shield, kick enemy, kick breach door)
;   G             - Plant Live Frag Grenade on Human Shield / Throw Grenade
;   Tab / Caps    - Toggle Bullet-Time Slow-Motion
;   1 / 2 / 3 / 4 - Weapon Strip Slots (MP7/Cruiser, 1911, Karambit, Dual Wield)
